# Deploys the trusted backend (functions/) to the psd-gaming Firebase project, then smoke-tests
# that the callable endpoints actually answer. Run it from the Actions tab: it is manual on purpose,
# because deploying is an operator decision and a not-yet-configured secret must not turn every
# push red.
#
# One-time setup (see docs/online-play.md → "Deploying" for the full runbook):
#
#   1. Upgrade the Firebase project to the Blaze plan. Cloud Functions (2nd gen) and the Cloud
#      Scheduler job (`cleanupExpired` every 15 minutes) are not available on the free Spark plan.
#   2. Firebase Console → Project settings → Service accounts → Generate new private key.
#   3. GitHub → Settings → Secrets and variables → Actions → New repository secret:
#      name `FIREBASE_SERVICE_ACCOUNT`, value = the contents of that JSON key file.
#      Give the service account enough roles to deploy: "Firebase Admin" plus "Cloud Scheduler
#      Admin" and "Service Account User" (functions run as the project's compute service account).
#   4. Actions → Deploy Cloud Functions backend → Run workflow.
#
# Without this deployment the production site cannot create or join rooms at all: the browser calls
# https://us-central1-psd-gaming.cloudfunctions.net/<name>, an undeployed function answers 404, and
# because that 404 carries no Access-Control-Allow-Origin header the browser console reports it as
# a CORS preflight failure. The smoke test at the end exists so that state can never look "green".

name: Deploy Cloud Functions backend

on:
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Mirror, test, deploy, smoke-test
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT: psd-gaming
      FIREBASE_REGION: us-central1
      SITE_ORIGIN: https://psd-gaming.vercel.app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      # functions/vendor is generated and gitignored, so a fresh checkout has no mirror at all:
      # build it, then verify it matches shared/ and src/engines/ exactly (same gate as CI).
      - name: Mirror the shared modules for the backend
        run: node scripts/sync-shared.mjs
      - name: The shared mirror matches shared/ and src/engines/
        run: node scripts/sync-shared.mjs --check
      - name: Install backend dependencies
        run: npm ci
        working-directory: functions
      - name: Backend tests (handlers, rooms, cleanup)
        run: npm test
        working-directory: functions
      - name: Authenticate to Firebase
        uses: google-githubactions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
      - name: Deploy
        run: |
          npm install --global firebase-tools@latest
          firebase deploy --only functions --project "$FIREBASE_PROJECT" --force
      # Two checks per function, both aimed at the failures an operator would otherwise only
      # discover from a player's console:
      #   1. the CORS preflight a browser sends before every callable must be answered with an
      #      Access-Control-Allow-Origin header — an undeployed function 404s with no such header
      #      (which the console then shows as the masked CORS error), and a function with public
      #      invocation ("allow unauthenticated") switched off fails the same way;
      #   2. an anonymous POST must be refused with 401 by the function itself — proof the endpoint
      #      exists, is publicly invocable and runs our auth check.
      - name: Smoke-test the deployed endpoints
        run: |
          set -euo pipefail
          base="https://${FIREBASE_REGION}-${FIREBASE_PROJECT}.cloudfunctions.net"
          status=0
          for fn in createRoom joinRoom playMove; do
            headers=$(curl -sS -D - -o /dev/null -X OPTIONS "$base/$fn" \
              -H "Origin: $SITE_ORIGIN" \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: authorization,content-type')
            if ! grep -qi '^access-control-allow-origin:' <<<"$headers"; then
              echo "::error::$fn did not answer the CORS preflight with an Access-Control-Allow-Origin header. It is not deployed, or public (unauthenticated) invocation is off. First response line: $(head -n 1 <<<"$headers")"
              status=1
              continue
            fi
            code=$(curl -sS --retry 5 --retry-delay 3 --retry-all-errors -o /tmp/body -w '%{http_code}' -X POST "$base/$fn" \
              -H "Origin: $SITE_ORIGIN" -H 'Content-Type: application/json' --data '{}')
            if [ "$code" != "401" ]; then
              echo "::error::$fn answered HTTP $code to an anonymous call (expected 401 UNAUTHENTICATED). Public invocation may be off, or the function is unhealthy. Body: $(head -c 300 /tmp/body)"
              status=1
              continue
            fi
            echo "$fn: preflight OK, anonymous call refused with 401 as expected."
          done
          exit $status
